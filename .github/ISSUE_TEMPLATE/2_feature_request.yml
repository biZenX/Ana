name: "Feature Request"
description: "Suggest a new idea or improvement for Wafeer."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Wafeer? We appreciate your feedback and suggestions!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: "Is this request related to a specific problem or limitation in the current workflow?"
      placeholder: "Describe the use case or problem..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the feature or change you would like to see."
      placeholder: "Explain how it should work..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative approaches or workarounds you've thought of?"

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Add mockups, screenshots, or reference links."
