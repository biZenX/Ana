name: "Currency Request"
description: "Request a new or missing currency format for Wafeer."
title: "[Currency]: "
labels: ["currency"]
body:
  - type: markdown
    attributes:
      value: |
        If your regional currency is missing or displays incorrectly, request it here!

  - type: input
    id: currency_name
    attributes:
      label: "Currency Name"
      placeholder: "e.g., Kuwaiti Dinar / Moroccan Dirham"
    validations:
      required: true

  - type: input
    id: currency_code
    attributes:
      label: "ISO Currency Code"
      description: "Standard 3-letter code (ISO 4217)."
      placeholder: "e.g., KWD, MAD, EGP, EUR"
    validations:
      required: true

  - type: input
    id: currency_symbol
    attributes:
      label: "Symbol or Abbreviation"
      placeholder: "e.g., KWD, د.ك, MAD, $"
    validations:
      required: true

  - type: input
    id: display_example
    attributes:
      label: "Display Example"
      placeholder: "e.g., 25.500 KWD or 150.00 MAD"
    validations:
      required: true
