name: "Bug Report"
description: "Report a bug or unexpected behavior in Wafeer."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help reproduce and fix it.

  - type: dropdown
    id: edition
    attributes:
      label: "App Edition"
      description: "Which distribution of Wafeer are you using?"
      options:
        - "FOSS / GitHub APK (Direct Download)"
        - "Google Play Edition"
        - "Built from source"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Wafeer Version"
      description: "Found in Settings -> About (e.g. v1.3.24)."
      placeholder: "v1.3.24"
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: "Device & Android Version"
      description: "e.g., Google Pixel 7 (Android 14) / Samsung Galaxy S23 (Android 14)."
      placeholder: "e.g., Pixel 7, Android 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of the bug."
      placeholder: "Describe what happened..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Open the app
        2. Go to '...'
        3. Tap on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Recordings"
      description: "Attach screenshots or screen recordings if applicable."

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Budget cycle setup, recurring bills, logcat output, or any other relevant details."
