name: Release Wafeer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.WAFEER_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.WAFEER_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.WAFEER_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.WAFEER_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            echo "Using repository release keystore from secrets."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            STORE_PASS="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASS="$RELEASE_KEY_PASSWORD"
          else
            echo "No keystore secrets found in repository. Generating release keystore."
            STORE_PASS="wafeer_release_pwd"
            KEY_ALIAS="wafeer"
            KEY_PASS="wafeer_release_pwd"
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Wafeer, OU=Wafeer, O=Wafeer, L=Cairo, S=Cairo, C=EG"
          fi

          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release-keystore.jks
          storePassword=${STORE_PASS}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASS}
          EOF

      - name: Build Release APKs
        run: |
          ./gradlew :app:assembleFossRelease :app:assembleWearRelease :wear:assembleRelease || ./gradlew :app:assembleFossRelease

      - name: Resolve Version and Changelog
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN="${TAG#v}"
          CLEAN="${CLEAN%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          [ "$CODE" -le 0 ] && CODE=1
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "changelog_path=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: "وفير ${{ github.ref_name }}"
          CHANGELOG_PATH: ${{ steps.version.outputs.changelog_path }}
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/foss/release/*.apk app/build/outputs/apk/wear/release/*.apk wear/build/outputs/apk/release/*.apk)
          echo "Found APKs: ${APKS[*]}"
          
          NOTES_FILE="release_notes.md"
          echo "## الجديد في هذا الإصدار:" > "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          if [ -n "$CHANGELOG_PATH" ] && [ -f "$CHANGELOG_PATH" ]; then
            cat "$CHANGELOG_PATH" >> "$NOTES_FILE"
          else
            echo "- تحسينات عامة على واجهة وتجربة المستخدم وضبط استقرار التطبيق." >> "$NOTES_FILE"
          fi
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "${APKS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${APKS[@]}" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi
