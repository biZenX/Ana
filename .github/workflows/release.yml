name: Release Wafeer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.WAFEER_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.WAFEER_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.WAFEER_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.WAFEER_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "config/signing/release.jks" ]; then
            echo "Using canonical release keystore from repository."
            cp config/signing/release.jks release-keystore.jks
            STORE_PASS="WafeerRelease2026Key!"
            KEY_ALIAS="wafeer"
            KEY_PASS="WafeerRelease2026Key!"
          elif [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            echo "Using repository release keystore from secrets."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            STORE_PASS="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-wafeer}"
            KEY_PASS="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            if ! keytool -list -keystore release-keystore.jks -storepass "$STORE_PASS" >/dev/null 2>&1; then
              echo "Warning: Keystore password in secrets failed validation. Generating fallback."
              STORE_PASS="WafeerRelease2026Key!"
              KEY_ALIAS="wafeer"
              KEY_PASS="WafeerRelease2026Key!"
              keytool -genkeypair -v \
                -keystore release-keystore.jks \
                -alias "$KEY_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                -dname "CN=Wafeer, OU=Wafeer, O=Wafeer, L=Cairo, S=Cairo, C=EG"
            fi
          else
            echo "Generating fallback release keystore."
            STORE_PASS="WafeerRelease2026Key!"
            KEY_ALIAS="wafeer"
            KEY_PASS="WafeerRelease2026Key!"
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Wafeer, OU=Wafeer, O=Wafeer, L=Cairo, S=Cairo, C=EG"
          fi

          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release-keystore.jks
          storePassword=${STORE_PASS}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASS}
          EOF

          echo "RELEASE_STORE_FILE=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build Release APKs
        run: |
          ./gradlew :app:assembleFossRelease :app:assembleWearRelease :wear:assembleRelease || ./gradlew :app:assembleFossRelease

      - name: Resolve Version and Changelog
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN="${TAG#v}"
          CLEAN="${CLEAN%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          [ "$CODE" -le 0 ] && CODE=1
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          
          AR_FILE="fastlane/metadata/android/ar/changelogs/${CODE}.txt"
          EN_FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          echo "ar_file=$AR_FILE" >> "$GITHUB_OUTPUT"
          echo "en_file=$EN_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: "Wafeer ${{ github.ref_name }}"
          AR_FILE: ${{ steps.version.outputs.ar_file }}
          EN_FILE: ${{ steps.version.outputs.en_file }}
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/foss/release/*.apk app/build/outputs/apk/wear/release/*.apk wear/build/outputs/apk/release/*.apk)
          echo "Found APKs: ${APKS[*]}"
          
          format_bilingual_release_notes() {
            local ar_path="$1"
            local en_path="$2"
            local ver_tag="$3"
            local out_file="$4"
            python3 - "$ar_path" "$en_path" "$ver_tag" "$out_file" << 'PYEOF'
          import sys, os

          ar_path, en_path, ver_tag, out_file = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          def parse_items(p):
              features, improvements, fixes = [], [], []
              if not os.path.exists(p):
                  return features, improvements, fixes
              with open(p, "r", encoding="utf-8") as f:
                  for raw in f:
                      line = raw.strip()
                      if not line.startswith("- ") and not line.startswith("* "):
                          continue
                      content = line[2:].strip()
                      lower = content.lower()
                      if lower.startswith("feat:") or lower.startswith("feature:"):
                          features.append(content.split(":", 1)[1].strip())
                      elif lower.startswith("improve:") or lower.startswith("perf:"):
                          improvements.append(content.split(":", 1)[1].strip())
                      elif lower.startswith("fix:") or lower.startswith("bug:"):
                          fixes.append(content.split(":", 1)[1].strip())
                      else:
                          improvements.append(content)
              return features, improvements, fixes

          ar_f, ar_i, ar_x = parse_items(ar_path)
          en_f, en_i, en_x = parse_items(en_path)

          lines = [f"# Wafeer {ver_tag} • وفير {ver_tag}", ""]

          if ar_f or ar_i or ar_x:
              lines.append("## مميزات التحديث (العربية)")
              lines.append("")
              if ar_f:
                  lines.append("### الميزات الجديدة")
                  lines.extend(f"- {x}" for x in ar_f)
                  lines.append("")
              if ar_i:
                  lines.append("### التحسينات العامة")
                  lines.extend(f"- {x}" for x in ar_i)
                  lines.append("")
              if ar_x:
                  lines.append("### الإصلاحات والاستقرار")
                  lines.extend(f"- {x}" for x in ar_x)
                  lines.append("")
              lines.append("---")
              lines.append("")

          lines.append("## Release Notes (English)")
          lines.append("")
          if en_f:
              lines.append("### Major Features")
              lines.extend(f"- {x}" for x in en_f)
              lines.append("")
          if en_i:
              lines.append("### Improvements")
              lines.extend(f"- {x}" for x in en_i)
              lines.append("")
          if en_x:
              lines.append("### Fixes & Stability")
              lines.extend(f"- {x}" for x in en_x)
              lines.append("")

          if not (en_f or en_i or en_x) and not (ar_f or ar_i or ar_x):
              lines.append("### Improvements")
              lines.append("- General improvements and bug fixes.")

          with open(out_file, "w", encoding="utf-8") as out:
              out.write("\n".join(lines).strip() + "\n")
          PYEOF
          }

          NOTES_FILE="release_notes.md"
          format_bilingual_release_notes "$AR_FILE" "$EN_FILE" "$TAG" "$NOTES_FILE"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "${APKS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE • وفير $TAG" --notes-file "$NOTES_FILE"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${APKS[@]}" --title "$TITLE • وفير $TAG" --notes-file "$NOTES_FILE"
          fi
