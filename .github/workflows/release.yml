name: Release Wafeer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APKs and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.WAFEER_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.WAFEER_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.WAFEER_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.WAFEER_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            echo "Using repository release keystore from secrets."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            STORE_PASS="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-wafeer}"
            KEY_PASS="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            if ! keytool -list -keystore release-keystore.jks -storepass "$STORE_PASS" >/dev/null 2>&1; then
              echo "Warning: Keystore password in secrets failed validation. Generating fallback release keystore."
              STORE_PASS=$(openssl rand -base64 16)
              KEY_ALIAS="wafeer"
              KEY_PASS="$STORE_PASS"
              keytool -genkeypair -v \
                -keystore release-keystore.jks \
                -alias "$KEY_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                -dname "CN=Wafeer, OU=Wafeer, O=Wafeer, L=Cairo, S=Cairo, C=EG"
            fi
          else
            echo "No keystore secrets found. Generating ephemeral release keystore."
            STORE_PASS=$(openssl rand -base64 16)
            KEY_ALIAS="wafeer"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Wafeer, OU=Wafeer, O=Wafeer, L=Cairo, S=Cairo, C=EG"
          fi

          cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release-keystore.jks
          storePassword=${STORE_PASS}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASS}
          EOF

          echo "RELEASE_STORE_FILE=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build Release APKs
        run: |
          ./gradlew :app:assembleFossRelease :app:assembleWearRelease :wear:assembleRelease || ./gradlew :app:assembleFossRelease

      - name: Resolve Version and Changelog
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN="${TAG#v}"
          CLEAN="${CLEAN%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          [ "$CODE" -le 0 ] && CODE=1
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "changelog_path=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: "Wafeer ${{ github.ref_name }}"
          CHANGELOG_PATH: ${{ steps.version.outputs.changelog_path }}
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/foss/release/*.apk app/build/outputs/apk/wear/release/*.apk wear/build/outputs/apk/release/*.apk)
          echo "Found APKs: ${APKS[*]}"
          
          format_changelog_to_markdown() {
            local src_file="$1"
            local ver_tag="$2"
            local out_file="$3"
            python3 - "$src_file" "$ver_tag" "$out_file" << 'PYEOF'
          import sys, re

          src_file, ver_tag, out_file = sys.argv[1], sys.argv[2], sys.argv[3]
          features, improvements, fixes = [], [], []

          with open(src_file, "r", encoding="utf-8") as f:
              for raw in f:
                  line = raw.strip()
                  if not line.startswith("- ") and not line.startswith("* "):
                      continue
                  content = line[2:].strip()
                  lower = content.lower()
                  if lower.startswith("feat:"):
                      features.append(content[5:].strip())
                  elif lower.startswith("improve:"):
                      improvements.append(content[8:].strip())
                  elif lower.startswith("fix:"):
                      fixes.append(content[4:].strip())
                  else:
                      improvements.append(content)

          def fmt_bullet(text):
              if ":" in text and not text.startswith("**"):
                  head, rest = text.split(":", 1)
                  return f"- **{head.strip()}:** {rest.strip()}"
              return f"- {text}"

          lines = [f"# Wafeer {ver_tag}", ""]
          if features:
              lines.append("### Major Features")
              lines.extend(fmt_bullet(x) for x in features)
              lines.append("")
          if improvements:
              lines.append("### Improvements")
              lines.extend(fmt_bullet(x) for x in improvements)
              lines.append("")
          if fixes:
              lines.append("### Fixes")
              lines.extend(fmt_bullet(x) for x in fixes)
              lines.append("")

          with open(out_file, "w", encoding="utf-8") as out:
              out.write("\n".join(lines).strip() + "\n")
          PYEOF
          }

          NOTES_FILE="release_notes.md"
          if [ -f "RELEASE_NOTES.md" ]; then
            cp "RELEASE_NOTES.md" "$NOTES_FILE"
          elif [ -n "$CHANGELOG_PATH" ] && [ -f "$CHANGELOG_PATH" ]; then
            format_changelog_to_markdown "$CHANGELOG_PATH" "$TAG" "$NOTES_FILE"
          else
            printf "# Wafeer %s\n\n### Improvements\n- Navigate faster and enjoy a smoother, more reliable experience across all screens.\n" "$TAG" > "$NOTES_FILE"
          fi
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "${APKS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${APKS[@]}" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi

          # Sync all previous GitHub Releases to clean English titles and structured user-focused notes
          for cl_file in fastlane/metadata/android/en-US/changelogs/*.txt; do
            fname=$(basename "$cl_file" .txt)
            if [[ "$fname" =~ ^[0-9]+$ ]]; then
              major=$(( fname / 10000 ))
              minor=$(( (fname % 10000) / 100 ))
              patch=$(( fname % 100 ))
              old_tag="v${major}.${minor}.${patch}"
              if [ "$old_tag" != "$TAG" ] && gh release view "$old_tag" >/dev/null 2>&1; then
                tmp_notes="notes_${fname}.md"
                format_changelog_to_markdown "$cl_file" "$old_tag" "$tmp_notes"
                gh release edit "$old_tag" --title "Wafeer ${old_tag}" --notes-file "$tmp_notes" || true
                rm -f "$tmp_notes"
              fi
            fi
          done
