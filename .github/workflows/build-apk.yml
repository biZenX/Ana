name: Build Wafeer APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wafeer APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleFossDebug

      - name: Rename APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/foss/debug/*.apk output_apk/Wafeer-v1.9.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wafeer-v1.9.0-debug
          path: output_apk/Wafeer-v1.9.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "وفير - Wafeer ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: output_apk/Wafeer-v1.9.0-debug.apk
          draft: false
          prerelease: false
          body: |
            ## تطبيق وفير (Wafeer) - الإصدار v1.9.0
            
            - تعريب كامل واحترافي للتطبيق.
            - إدماج خط ثمانية الفخم (مع الأحرف المنسدلة للعناوين) وخط IBM Plex Sans Arabic.
            - مخصص للمطور عبدالرحمن كريم.
